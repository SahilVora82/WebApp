<!DOCTYPE html>

<!DOCTYPE HTML>

<html>

<head>
    <link rel="icon" type="image/x-icon" href="AddAHeading.png">
    <title>Requests</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Multiple Inputs</title>
    <style>
        body {
            font-family:"Open Sans", sans-serif;
            margin: 20px;
        }
        input[type=text] {

width: 100%;
padding: 3% 5%;
margin: 8px 0;
box-sizing: border-box;
font-family:"Open Sans", sans-serif;
}
        .output-container {
            margin-top: 10px;

        }
        .output-item {
            background-color: rgba(130, 183, 236, 0.755);
            padding: 5px;
            border-radius: 40%;
            margin-top: 5px;
            font-weight: bold;
            margin-left: 10px;
            float: left;
        }


        #suggestions {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgb(255, 255, 255);
            background-color: rgb(151, 151, 151);
            width: 80%;
            position: absolute;
            z-index: 1000;
        }
    </style>



    <link rel="stylesheet" href="request.css">
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<body style="background-color: black;">


<div class = "input-container">
    <div class="container">
        <img src="AddAHeading.png" alt="Snow" style="width:40%;"><br><br>
        <form id="requests" action="/api/request" method="POST">
            <label for="request" >What items do you need?</label><br>
            <input type="text" id="request" name="request" placeholder = "What are you looking for?"><br><br>
            <div class="output-container" id="output"></div><br><br>

            <label for="location">What is your location (address)?</label><br>
            <input type="text" id="location" name="location" placeholder="Where should it be delivered?"><br><br>
            <div id="suggestions"></div><br><br>


            <input type="submit" value="Submit">
        </form>
    </div>
</div>



<script>
    const locationInput = document.getElementById('location');
    const suggestionsContainer = document.getElementById('suggestions');

    locationInput.addEventListener('input', function () {
        const query = locationInput.value;
        const apiKey = '34cf68a9550546f4b6778f5c446d6718';

        fetch(`https://api.geoapify.com/v1/geocode/autocomplete?text=${encodeURIComponent(query)}&apiKey=${apiKey}`)
            .then(response => response.json())
            .then(data => {
                suggestionsContainer.innerHTML = '';

                if (data.features) {
                    data.features.forEach(feature => {
                        const suggestion = document.createElement('div');
                        suggestion.textContent = feature.properties.formatted;
                        suggestion.classList.add('suggestion-item');

                        suggestion.addEventListener('click', () => {
                            locationInput.value = feature.properties.formatted;
                            suggestionsContainer.innerHTML = '';
                        });

                        suggestionsContainer.appendChild(suggestion);
                    });
                }
            })
            .catch(error => console.error('Error fetching autocomplete results:', error));
    });
</script>


</body>
</html>
