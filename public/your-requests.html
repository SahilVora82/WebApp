<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Tab Icon -->
    <link rel="icon" type="image/x-icon" href="AddAHeading.png">
    
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title -->
    <title>Active Requests</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="your-requests.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Additional Font Import -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700,0,800;0,900&display=swap');

        /* Ensure buttons appear next to each other */
        button {
            display: inline-block;
            margin: 5px; /* Optional: Adds some space between buttons */
        }

        /* Wrap buttons in a flex container for better layout control */
        .button-container {
            display: flex;
            gap: 10px; /* Optional: Adds space between buttons */
        }
    </style>
</head>

<body style="background-color: rgb(16, 16, 16);">
    <!-- Logo Section -->
    <div class="logo">
        <a href="LandingPage.html" class="image-link">
            <img src="AddAHeading.png" style="width: 15%;" class="hover-image" alt="Logo" />
        </a>
    </div>

    <!-- Page Title and Action Buttons -->
    <h1 style="color:white">Your Requests Made
        <a href="Request.html">
            <span class="material-symbols-outlined" style="color: aliceblue;">add_circle</span>
        </a>
        <span class="material-symbols-outlined" onclick="location.reload()">refresh</span>
    </h1>

    <!-- User Requests Container -->
    <h4>
        <div class="box-container" id="box-container"></div>
    </h4>
    <br><br>

    <!-- Accepted Requests Section -->
    <h1 style="color:white">Requests You Have Accepted</h1>
    <h4>
        <div class="box-container" id="accepted-box-container"></div>
    </h4>

    <!-- JavaScript Section -->
    <script>
        function createBoxes(boxes, loggedInUsername) {
            const container = document.getElementById('box-container');
            container.innerHTML = '';

            const userRequests = boxes.filter(box => box.username === loggedInUsername);

            userRequests.forEach(box => {
                const boxElement = document.createElement('div');
                boxElement.className = 'box';
                let actionButtonHTML = '';
                let statusImage = document.createElement('img'); 

                statusImage.style.width = "calc(100% - 20px)";
                statusImage.style.display = "block";
                statusImage.style.margin = "10px auto";
                statusImage.style.padding = "10px";
                statusImage.style.borderRadius = "10px";

                statusImage.alt = "Request Status";
                statusImage.width = 50;
               

                

                if (box.accepted === "yes") {
    actionButtonHTML += `<button class="Accepted" disabled>Accepted by: ${box.requester_name}</button>`;
    statusImage.src = "Order_Accepted__1_-removebg-preview.png";

    if (box.delivered === "no") {
        actionButtonHTML += `
            <div class="button-container">
                <form action="/api/deliver" method="POST">
                    <input type="hidden" name="numberID" value="${box.numberID}" />
                    <button class="Deliver" type="submit">Mark as Delivered</button>
                </form>
            </div>
        `;
    } else {
        actionButtonHTML += `<button class="Delivered" disabled><b>Delivered</b><span class="material-symbols-outlined">check_circle</span></button>`;
        statusImage.src = "Delivered-removebg-preview.png";
    }
} else {
    actionButtonHTML = `
        <form action="/api/accept" method="POST">
            <input type="hidden" name="numberID" value="${box.numberID}" />
            <button class="Accept" type="submit">Awaiting Acceptance</button>
        </form>
    `;
    statusImage.src = "NoneNB.png"; // <-- Set a default pending image
}


                

                statusImage.alt = "Request Status";
                statusImage.width = 200;

                boxElement.innerHTML = `
                    <div class="name">${box.username}</div>
                    <div class="request">${box.request}</div>
                    <div class="location">${box.location}</div>
                    ${actionButtonHTML}
                `;

                boxElement.appendChild(statusImage);
                container.appendChild(boxElement);
            });

            if (userRequests.length === 0) {
                container.innerHTML = `<p>No requests found for your account.</p>`;
            }
            
        }

        function createAcceptedBoxes(boxes, loggedInUsername) {
            const container = document.getElementById('accepted-box-container');
            container.innerHTML = '';

            const acceptedRequests = boxes.filter(
                box => box.requester_name === loggedInUsername && box.accepted === "yes"
            );

            acceptedRequests.forEach(box => {
                const boxElement = document.createElement('div');
                boxElement.className = 'box';
                let actionButtonHTML = '';
                let statusImage = document.createElement('img');

                if (box.delivered === "yes") {
                    actionButtonHTML += `
                        <button class="Delivered" disabled>
                            Delivered <span class="material-symbols-outlined">check_circle</span>
                        </button>
                    `;
                    statusImage.src = "Delivered-removebg-preview.png";
                } else if (box.picking_up_items === 1) {
                    statusImage.src = "Order_Accepted__2_-removebg-preview.png"; // Image for picking up items
                } else if (box.on_my_way === 1) {
                    statusImage.src = "Order_Accepted__3_-removebg-preview.png"; // Image for on my way
                } else {
                    actionButtonHTML += `
                        <div class="button-container">
                            <form action="/api/pickingup" method="POST">
                                <input type="hidden" name="numberID" value="${box.numberID}" />
                                <button class="PickingUp" type="submit">Mark as Picking Up Items</button>
                            </form>
                            <form action="/api/on-my-way" method="POST">
                                <input type="hidden" name="numberID" value="${box.numberID}" />
                                <button class="OnMyWay" type="submit">Mark as On My Way</button>
                            </form>
                            <form action="/api/deliver" method="POST">
                                <input type="hidden" name="numberID" value="${box.numberID}" />
                                <button class="Deliver" type="submit">Mark as Delivered</button>
                            </form>
                        </div>
                    `;
                    statusImage.src = "Order_Accepted__1_-removebg-preview.png";
                }

                statusImage.style.width = "calc(100% - 20px)";
                statusImage.style.display = "block";
                statusImage.style.margin = "10px auto";
                statusImage.style.padding = "10px";
                statusImage.style.borderRadius = "10px";

                statusImage.alt = "Request Status";
                statusImage.width = 50;

                boxElement.innerHTML = `
                    <div class="name">Requested by: ${box.username}</div>
                    <div class="request">${box.request}</div>
                    <div class="location">${box.location}</div>
                    ${actionButtonHTML}
                `;

                boxElement.appendChild(statusImage);
                container.appendChild(boxElement);
            });

            if (acceptedRequests.length === 0) {
                container.innerHTML = `<p>You have not accepted any requests yet.</p>`;
            }
        }

        fetch('/api/get-requests')
            .then(response => response.json())
            .then(data => {
                const { boxes, loggedInUsername } = data;
                createBoxes(boxes, loggedInUsername);
                createAcceptedBoxes(boxes, loggedInUsername);
            })
            .catch(error => {
                console.error('Error fetching data:', error);
            });
    </script>
</body>
</html>
