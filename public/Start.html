<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile Scaling -->
    <link rel="icon" type="image/x-icon" href="AddAHeading.png">
    <link rel="stylesheet" href="Home Page.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>

<body>

    <div class="text">
        <div class="container">
            <div class="background">
                <img src="neighborhood.jpeg" alt="Neighborhood" class="responsive-img">
            </div>

            <div class="left">
                <img src="AddAHeading.png" class="logo-img">

                <div class="containera"></div>

                <div class="centered">
                    <b>Neighborly Help, Just a Tap Away—Get the Support You Need When You're Under the Weather.</b>
                    <br>
                    <a href="Signup.html" class="button signup">
                        Signup
                        <span class="material-symbols-outlined">person_add</span>
                    </a>
                    <div class="login-container">
                        <a href="Login.html" class="button login">
                            Login
                            <span class="material-symbols-outlined">login</span>
                        </a>
                    </div>
                </div>

                <br>

                
            </div>
        </div>
    </div>

    <br>

    <div class="random-act">
    <div class="random-act-container">
        <center>
            <h3>Random Act of Kindness: <span id="random-act-message">Loading...</span></h3>
        </center>
  

    <script>
        async function fetchRandomAct() {
            try {
                const response = await fetch('/api/random-act');
                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();
                document.getElementById('random-act-message').textContent = data.message || 'No message available';
            } catch (error) {
                console.error('Error fetching random act:', error);
                document.getElementById('random-act-message').textContent = 'Oops, something went wrong. Please try again later.';
            }
        }

        window.onload = fetchRandomAct;
    </script>
    
    </div>
    </div>
    <div class="container">
        <video autoplay muted class="responsive-video">
            <source src="Congressional app.mp4">
        </video>

        <h2>Come together with your neighbors to build stronger, more connected communities.</h2>

        <div class="icon">
            <img src="connection.png" alt="Connection" class="icon-img">
        </div>
    </div>

</body>

</html>
